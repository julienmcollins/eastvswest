<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER. NOT THE OFFICIAL STRAVA ASSET.

  This is a hand-authored stand-in for the official "Connect with Strava" button,
  created only because developers.strava.com was unreachable from the build
  environment. It uses Strava orange #FC5200 and the official button's 193x48
  proportions so layout work is not wasted.

  It MUST be replaced, byte-for-byte unmodified, with the official button asset from
  https://developers.strava.com/guidelines/ before any public deployment.
  The official button must never be restyled, recoloured, resized below the documented
  minimum, or have its wording changed. See ./README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="193" height="48" viewBox="0 0 193 48" role="img" aria-label="Connect with Strava">
  <title>Connect with Strava</title>
  <rect x="0" y="0" width="193" height="48" rx="4" fill="#FC5200"/>
  <!-- Strava chevron mark, simplified -->
  <g fill="#FFFFFF" transform="translate(16 12)">
    <path d="M9.6 0 3.2 12.6h3.8L9.6 7.5l2.6 5.1H16z"/>
    <path d="M12.2 12.6 9.6 17.7 7 12.6H4.3l5.3 10.4 5.3-10.4z" opacity="0.85"/>
  </g>
  <!--
    `textLength` + `lengthAdjust` are load-bearing, not decoration. The label previously
    overflowed the 193-wide viewBox and was clipped at the right edge: 19 glyphs of
    Helvetica semibold at 15px measure ~153 units, and starting at x=48 that ends at ~201.
    Dropping to 13px and x=44 makes it fit on Helvetica/Arial, but this SVG renders with
    whatever font the VIEWER has, and a wider fallback (DejaVu Sans on Linux is ~10%
    wider) would clip again. Pinning the advance width makes fitting a property of the
    file rather than a property of the machine that opens it.
  -->
  <text x="44" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF"
        textLength="137" lengthAdjust="spacingAndGlyphs">Connect with Strava</text>
</svg>
