<!--
  PLACEHOLDER. NOT THE OFFICIAL STRAVA ASSET.

  Hand-authored stand-in for the official "Powered by Strava" logo, created only because
  developers.strava.com was unreachable from the build environment. Strava orange is
  #FC5200.

  MUST be replaced, byte-for-byte unmodified, with the official "Powered by Strava" logo
  from https://developers.strava.com/guidelines/ before any public deployment. This mark
  is a contractual attribution requirement and must stay visible without interaction on
  every view that displays Strava data. See ./README.md.
-->
