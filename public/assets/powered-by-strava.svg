  <title>Powered by Strava</title>
  <text x="0" y="19" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B7280">Powered by</text>
  <text x="74" y="19" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FC5200">STRAVA</text>
</svg>
